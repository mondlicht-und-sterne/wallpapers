<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>moooon wallpapers</title>
<style>
body{background:#111;color:#eee;font-family:system-ui;margin:0;padding:20px}
#search{width:100%;max-width:400px;padding:10px 14px;border-radius:999px;border:1px solid #333;background:#1a1a1a;color:#fff;margin:16px 0}
#filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter{padding:6px 14px;border-radius:999px;border:0;background:#222;color:#ccc;cursor:pointer}
.filter.active{background:#b68cff;color:#111;font-weight:700}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:#1a1a1a;border-radius:16px;overflow:hidden}
.card img{width:100%;height:210px;object-fit:cover;display:block}
.card p{margin:8px 10px;font-size:13px}
</style>
</head>
<body>
<h2>mondstern wallpapers</h2>
<input id="search" placeholder="Suche...">
<div id="filters"></div>
<div id="grid"></div>
<script>
let all=[];let active='all';
fetch('config.json').then(r=>r.json()).then(d=>{all=d;build();render()});
function build(){
 const t=new Set();all.forEach(i=>(i.tags||[]).forEach(x=>t.add(x)));
 document.getElementById('filters').innerHTML=`<button class="filter active" onclick="setF('all',this)">All ${all.length}</button>`+[...t].map(x=>`<button class="filter" onclick="setF('${x}',this)">${x}</button>`).join('');
}
function setF(f,el){active=f;document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}
function render(){
 const q=document.getElementById('search').value.toLowerCase();
 document.getElementById('grid').innerHTML='';
 all.filter(i=>{
  const s=!q||i.name.toLowerCase().includes(q)||(i.tags||[]).join(' ').toLowerCase().includes(q);
  const fil=active==='all'||(i.tags||[]).includes(active);
  return s&&fil;
 }).forEach(i=>{
  const d=document.createElement('div');d.className='card';
  d.innerHTML=`<img src="${i.url}" loading="lazy"><p>${i.name}</p>`;
  document.getElementById('grid').appendChild(d);
 });
}
document.getElementById('search').addEventListener('input',render);
</script>
</body>
</html>
